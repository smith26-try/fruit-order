<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS ร้านผลไม้ - น้องเอิน ฝรั่งแช่บ๊วย</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ===== GLOBAL ===== */
* { box-sizing: border-box; }
body { 
  margin: 0; 
  font-family: 'Kanit', sans-serif; 
  background: #eef2f6; 
  color: #333;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

/* ===== APP ===== */
.app {
  max-width: 1380px;
  margin: 20px auto; 
  height: calc(100vh - 40px);
  display: grid; 
  grid-template-columns: 1.45fr 1fr; 
  background: #ffffff;
  border-radius: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.08);
  overflow: hidden;
}

/* ===== LEFT ===== */
.left { display: flex; flex-direction: column; background: #f8fafc; overflow: hidden; }

/* CATEGORY */
.category-bar {
  display: flex; 
  overflow-x: auto; 
  background: linear-gradient(135deg, #3F7D58, #2c593e);
  padding: 14px 18px; 
  gap: 8px;
  align-items: center;
}
.category-btn {
  background: rgba(255, 255, 255, 0.2); 
  color: #fff;
  padding: 7px 14px; 
  border-radius: 30px; 
  cursor: pointer; 
  white-space: nowrap;
  user-select: none;
  font-weight: 500;
  font-size: 13.5px;
  transition: all 0.3s ease;
  border: 1px solid rgba(255,255,255,0.1);
}
.category-btn:hover { background: rgba(255, 255, 255, 0.3); }
.active { 
  background: #ffffff !important; 
  color: #2c593e !important; 
  font-weight: 600; 
  box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
}
.btn-refresh {
  margin-left: auto;
  background: rgba(255,255,255,0.25);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
.btn-refresh:hover { background: rgba(255,255,255,0.4); }

/* MENU */
.menu {
  flex: 1; 
  overflow-y: auto; 
  padding: 18px;
  display: grid; 
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
  gap: 14px;
  align-content: start;
  min-height: 0;
}
.menu-item {
  background: #fff; 
  border-radius: 16px; 
  padding: 10px; 
  text-align: center; 
  cursor: pointer;
  border: 1px solid #e2e8f0;
  box-shadow: 0 4px 6px rgba(0,0,0,0.02); 
  transition: all 0.2s ease;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.menu-item:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 15px rgba(63, 125, 88, 0.15);
  border-color: #3F7D58;
}
.menu-item:active { transform: scale(0.96); }
.menu-item.unavailable {
  opacity: 0.55;
  background: #f1f5f9;
  border-color: #cbd5e1;
}

.item-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 6px;
  margin-bottom: 6px;
  display: inline-block;
}
.badge-warning { background: #ffedd5; color: #ea580c; }
.badge-danger { background: #fee2e2; color: #dc2626; }

.menu-title { font-size: 13.5px; margin-bottom: 6px; line-height: 1.3; font-weight: 500; }
.menu-price { color: #3F7D58; font-weight: 600; font-size: 15.5px; }

.btn-edit-item {
  position: absolute;
  top: 6px;
  right: 6px;
  background: rgba(255,255,255,0.85);
  border: 1px solid #e2e8f0;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
}
.btn-edit-item:hover { background: #3F7D58; color: #fff; }

/* CUSTOM */
.custom-box {
  padding: 14px 18px; 
  border-top: 1px solid #e2e8f0; 
  background: #fff;
}
.custom-box input {
  width: 100%; margin-bottom: 8px; padding: 8px 12px; 
  border: 1px solid #cbd5e1; border-radius: 8px; 
  font-family: inherit; transition: all 0.3s;
}
.custom-box input:focus {
  border-color: #3F7D58; box-shadow: 0 0 0 3px rgba(63, 125, 88, 0.15); outline: none;
}
.custom-box button {
  width: 100%; padding: 9px; background: #0ea5e9; color: #fff; 
  border: none; border-radius: 8px; cursor: pointer; 
  font-weight: 600; font-family: inherit; font-size: 14px; transition: 0.2s;
}
.custom-box button:hover { background: #0284c7; }

/* ===== RIGHT ===== */
.right { 
  display: flex; flex-direction: column; 
  border-left: 1px solid #e2e8f0; 
  background: #ffffff;
  overflow: hidden;
}

.paste-order-box {
  padding: 12px 18px;
  background: #f0fdf4;
  border-bottom: 2px dashed #bbf7d0;
}
