<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>POS ร้านผลไม้ - น้องเอิน ฝรั่งแช่บ๊วย</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; font-family: 'Kanit', sans-serif; background: #eef2f6; color: #333; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

.app { max-width: 1380px; margin: 20px auto; height: calc(100vh - 40px); display: grid; grid-template-columns: 1.45fr 1fr; background: #fff; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); overflow: hidden; }
.left { display: flex; flex-direction: column; background: #f8fafc; overflow: hidden; }
.category-bar { display: flex; overflow-x: auto; background: linear-gradient(135deg, #3F7D58, #2c593e); padding: 14px 18px; gap: 8px; align-items: center; }
.category-btn { background: rgba(255,255,255,0.2); color: #fff; padding: 7px 14px; border-radius: 30px; cursor: pointer; white-space: nowrap; user-select: none; font-weight: 500; font-size: 13.5px; border: 1px solid rgba(255,255,255,0.1); }
.active { background: #fff !important; color: #2c593e !important; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.btn-refresh { margin-left: auto; background: rgba(255,255,255,0.25); color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }

.menu { flex: 1; overflow-y: auto; padding: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; align-content: start; min-height: 0; }
.menu-item { background: #fff; border-radius: 16px; padding: 10px; text-align: center; cursor: pointer; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: 0.2s; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
.menu-item:active { transform: scale(0.96); }
.menu-item.unavailable { opacity: 0.55; background: #f1f5f9; border-color: #cbd5e1; }
.item-badge { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 6px; margin-bottom: 6px; display: inline-block; }
.badge-warning { background: #ffedd5; color: #ea580c; }
.badge-danger { background: #fee2e2; color: #dc2626; }
.menu-title { font-size: 13.5px; margin-bottom: 6px; line-height: 1.3; font-weight: 500; }
.menu-price { color: #3F7D58; font-weight: 600; font-size: 15.5px; }
.btn-edit-item { position: absolute; top: 6px; right: 6px; background: rgba(255,255,255,0.9); border: 1px solid #e2e8f0; border-radius: 50%; width: 24px; height: 24px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

.custom-box { padding: 14px 18px; border-top: 1px solid #e2e8f0; background: #fff; }
.custom-box input { width: 100%; margin-bottom: 8px; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; }
.custom-box button { width: 100%; padding: 9px; background: #0ea5e9; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: inherit; font-size: 14px; }

.right { display: flex; flex-direction: column; border-left: 1px solid #e2e8f0; background: #fff; overflow: hidden; }
.paste-order-box { padding: 12px 18px; background: #f0fdf4; border-bottom: 2px dashed #bbf7d0; }
.paste-order-box textarea { width: 100%; height: 60px; padding: 8px 12px; border: 1px solid #86efac; border-radius: 8px; font-family: inherit; font-size: 13px; resize: vertical; background: #fff; }

.customer { padding: 12px 18px 14px; background: #fff; border-bottom: 1px solid #e2e8f0; }
.customer input, .customer textarea { width: 100%; margin-bottom: 8px; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; background: #f8fafc; }
.customer input:focus, .customer textarea:focus { border-color: #3F7D58; outline: none; background: #fff; }
.customer textarea { resize: vertical; min-height: 55px; }

.autocomplete-wrapper { position: relative; width: 100%; }
.suggestions-box { position: absolute; top: calc(100% - 4px); left: 0; right: 0; background: #fff; border: 2px solid #3F7D58; border-radius: 12px; z-index: 9999; display: none; max-height: 250px; overflow-y: auto; -webkit-overflow-scrolling: touch; box-shadow: 0 12px 30px rgba(0,0,0,0.22); }
.suggestion-item { padding: 11px 14px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
.suggestion-item:hover { background: #f0fdf4; color: #3F7D58; }

.cart { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; background: #f8fafc; min-height: 0; }
.cart-item { background: #fff; padding: 10px 12px; border-radius: 12px; border: 1px solid #e2e8f0; }
.cart-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
.qty-controls { display: flex; flex-wrap: wrap; gap: 5px; }
.qty-controls button { padding: 5px 9px; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12.5px; color: #475569; font-weight: 500; }
.btn-remove { color: #ef4444 !important; border-color: #fca5a5 !important; background: #fef2f2 !important; }

.summary { padding: 14px 18px; border-top: 1px solid #e2e8f0; background: #fff; }
.total { font-size: 22px; font-weight: 600; margin-bottom: 12px; text-align: right; color: #3F7D58; }
.btn-group { display: flex; gap: 10px; }
.btn-group button { flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; font-weight: 600; font-family: inherit; }
.primary { background: #3F7D58; color: #fff; }
.danger { background: #ef4444; color: #fff; }

.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 10000; }
.modal-content { background: #fff; padding: 22px; border-radius: 16px; width: 92%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
.modal-content h3 { color: #0f172a; margin: 0 0 4px; }
.modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; }
.modal-content textarea.bill-textarea { height: 280px; resize: none; background: #f8fafc; font-size: 13.5px; line-height: 1.5; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
.modal-actions button { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: inherit; }
.btn-cancel { background: #e2e8f0; color: #475569; }
.btn-confirm { background: #3F7D58; color: #fff; }
.btn-copy { background: #EC5228; color: #fff; }
.pos-option-btn { width: 100%; padding: 12px 14px; margin-bottom: 6px; background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 500; color: #334155; cursor: pointer; text-align: left; }

@media screen and (max-width: 1024px) {
  .app { display: flex; flex-direction: column; height: auto; min-height: 100vh; margin: 0; border-radius: 0; box-shadow: none; overflow: visible; }
  .right { display: contents; }
  .paste-order-box { order: 1; }
  .customer { order: 2; }
  .left { order: 3; height: auto; border-top: 4px solid #3F7D58; border-bottom: 4px solid #3F7D58; overflow: visible; }
  .cart { order: 4; min-height: 150px; max-height: none; }
  .summary { order: 5; padding: 14px; position: sticky; bottom: 0; z-index: 90; box-shadow: 0 -4px 15px rgba(0,0,0,0.08); }
  .menu { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); padding: 14px; gap: 10px; overflow-y: visible; }
}
</style>
</head>
<body>

<div class="app">
  <div class="left">
    <div class="category-bar">
      <div id="categoryBar" style="display:flex; gap:8px; overflow-x:auto;"></div>
      <button class="btn-refresh" onclick="loadMenuFromDB()">🔄 รีเฟรช</button>
    </div>
    <div class="menu" id="menuList">
      <div style="grid-column: 1/-1; text-align:center; padding: 40px; color:#64748b;">กำลังโหลดเมนูสดจากฐานข้อมูล...</div>
    </div>
    <div class="custom-box">
      <b style="display:block; margin-bottom:8px; color:#0f172a; font-size:14px;">เพิ่มสินค้าอื่น (นอกเมนู)</b>
      <div style="display: flex; gap: 10px;">
        <input id="customName" placeholder="ชื่อสินค้า" style="flex: 2; margin-bottom: 0;">
        <input id="customPrice" type="number" placeholder="ราคา" style="flex: 1; margin-bottom: 0;">
      </div>
      <button onclick="addCustom()" style="margin-top: 8px;">+ เพิ่มลงตะกร้า</button>
    </div>
  </div>

  <div class="right">
    <div class="paste-order-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <span style="font-size:12.5px; font-weight:600; color:#166534;">📥 วางข้อความที่ลูกค้าก๊อปมา (ดึงยอดอัตโนมัติ):</span>
        <button onclick="clearPasteBox()" style="background:none; border:none; font-size:11px; color:#64748b; cursor:pointer;">ล้างข้อความ</button>
      </div>
      <textarea id="pasteOrderInput" placeholder="แตะค้างแล้วกด 'วาง' ข้อความที่ลูกค้าส่งมาที่นี่..." oninput="parseCustomerOrder(this.value)"></textarea>
    </div>

    <div class="customer">
      <div class="autocomplete-wrapper">
        <input id="name" placeholder="ชื่อลูกค้า (แตะเพื่อดูรายชื่อทั้งหมด หรือพิมพ์ค้นหา)" 
               oninput="showCustomerDropdown('name')" 
               onfocus="showCustomerDropdown('name')" 
               onclick="showCustomerDropdown('name')" 
               autocomplete="off">
        <div id="nameSuggestions" class="suggestions-box"></div>
      </div>
      
      <div style="display: flex; gap: 10px; margin-bottom: 8px;">
        <div class="autocomplete-wrapper" style="flex: 1; min-width: 0;">
          <input id="phone" placeholder="เบอร์โทร (แตะหรือพิมพ์ค้นหา)" 
                 oninput="showCustomerDropdown('phone')" 
                 onfocus="showCustomerDropdown('phone')" 
                 onclick="showCustomerDropdown('phone')" 
                 autocomplete="off" style="margin-bottom: 0;">
          <div id="phoneSuggestions" class="suggestions-box"></div>
        </div>
        <input type="date" id="orderDate" style="flex: 1; min-width: 0; color: #475569; cursor: pointer; margin-bottom: 0;">
      </div>

      <textarea id="address" placeholder="ที่อยู่จัดส่ง / จุดนัดรับ"></textarea>
      
      <div style="display: flex; gap: 10px;">
        <input id="shipping" type="number" placeholder="ค่าจัดส่ง (฿)" oninput="renderCart()" style="flex: 1; min-width: 0; margin-bottom:0;">
        <input id="remark" placeholder="หมายเหตุ / รอบส่ง (11.00 หรือ 15.00)" style="flex: 2; min-width: 0; margin-bottom:0;">
      </div>
    </div>

    <div class="cart" id="cartList"></div>

    <div class="summary">
      <div class="total">ยอดรวม: ฿ <span id="totalEl">0</span></div>
      <div class="btn-group">
        <button class="primary" onclick="checkout()">สรุปบิล</button>
        <button class="danger" onclick="newOrder()">เริ่มบิลใหม่</button>
      </div>
    </div>
  </div>
</div>

<!-- Modals -->
<div id="posSauceModal" class="modal-overlay">
  <div class="modal-content" style="max-width: 360px;">
    <h3 id="posSauceTitle">เลือกสูตรน้ำปลาหวาน</h3>
    <p style="font-size:13px; color:#64748b; margin:0 0 6px;">ระบุสูตรน้ำปลาหวานที่ต้องการเพิ่ม:</p>
    <button class="pos-option-btn" onclick="confirmSauceSelection('สูตรกุ้งแห้ง')">🦐 น้ำปลาหวานกุ้งแห้ง</button>
    <button class="pos-option-btn" onclick="confirmSauceSelection('สูตรปลาป่น')">🐟 น้ำปลาหวานปลาป่น</button>
    <button class="pos-option-btn" onclick="confirmSauceSelection('สูตรปลาร้าข้าวคั่ว')">🌾 น้ำปลาหวาน สูตรปลาร้าข้าวคั่ว</button>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal('posSauceModal')">ยกเลิก</button></div>
  </div>
</div>

<div id="alertModal" class="modal-overlay">
  <div class="modal-content" style="max-width: 300px; text-align: center;">
    <h3>แจ้งเตือน</h3>
    <p id="alertMessage" style="color: #475569; margin-bottom: 10px;"></p>
    <div class="modal-actions"><button class="btn-confirm" onclick="closeModal('alertModal')" style="width: 100%;">ตกลง</button></div>
  </div>
</div>

<div id="billModal" class="modal-overlay">
  <div class="modal-content">
    <h3>สรุปรายการสั่งซื้อ</h3>
    <textarea id="billTextarea" class="bill-textarea" readonly></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('billModal')">ปิดหน้าต่าง</button>
      <button class="btn-copy" id="copyBtn" onclick="copyBillText()">คัดลอกข้อความ</button>
    </div>
  </div>
</div>

<div id="confirmModal" class="modal-overlay">
  <div class="modal-content" style="max-width: 320px; text-align: center;">
    <h3 style="color: #ef4444;">ยืนยันการทำรายการ</h3>
    <p style="color: #475569;">ต้องการล้างตะกร้าและเริ่มบิลใหม่ใช่หรือไม่?</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('confirmModal')" style="flex:1;">ยกเลิก</button>
      <button class="btn-confirm" onclick="executeNewOrder()" style="flex:1; background: #ef4444;">ตกลง</button>
    </div>
  </div>
</div>

<div id="editItemModal" class="modal-overlay">
  <div class="modal-content">
    <h3 id="editItemTitle">แก้ไขสินค้า</h3>
    <input type="hidden" id="editRowIndex">
    <label style="font-size:13px; font-weight:600; color:#475569;">ราคา (บาท):</label>
    <input id="editItemPrice" type="number">
    <label style="font-size:13px; font-weight:600; color:#475569; margin-top:4px;">สถานะ / หมวดหมู่:</label>
    <select id="editItemCategory">
      <option value="ผลไม้พร้อมส่งวันนี้ (ลูกค้ากดสั่งซื้อได้)">ผลไม้พร้อมส่งวันนี้</option>
      <option value="ใกล้หมดฤดูกาล (มีป้ายเตือนสีส้ม ลูกค้ากดสั่งได้)">ใกล้หมดฤดูกาล</option>
      <option value="หมดชั่วคราว (ปุ่มสั่งซื้อจะถูกปิดการใช้งานชั่วคราว)">หมดชั่วคราว</option>
      <option value="หมดฤดูกาลแล้ว (ป้ายสีเทา ปิดการสั่งซื้อ)">หมดฤดูกาลแล้ว</option>
      <option value="บริการการ์ด ริบบิ้น และปิ่นโตผลไม้">บริการการ์ด ริบบิ้น และปิ่นโตผลไม้</option>
    </select>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('editItemModal')">ยกเลิก</button>
      <button class="btn-confirm" onclick="saveItemUpdate()">บันทึกข้อมูล</button>
    </div>
  </div>
</div>

<script>
const MENU_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwyPQUcJ3lqv67b6nOJHgQMrFxowoPbiprYFbFOfH_yPLimMWAoneY_e2vS82yBIWSj/exec";
const CUSTOMER_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTW0q_MTBBWTHCV3FCtlzm9dyczfB71m8paEZ5iXpwQO5FFL6mvB_H_QPpYnv4MDDjCQ/exec";

const APP_CATEGORIES = ["ทั้งหมด", "ผลไม้พร้อมส่งวันนี้", "ใกล้หมดฤดูกาล", "หมดชั่วคราว", "หมดฤดูกาลแล้ว", "บริการการ์ด ริบบิ้น และปิ่นโตผลไม้"];

let menu = [];
let active = "ทั้งหมด";
let cart = [];
let customersDB = [];
let pendingPOSItem = null;

function loadCustomersFromSheet() {
  fetch(`${CUSTOMER_SCRIPT_URL}?t=${Date.now()}`)
    .then(r => r.text())
    .then(t => {
      let clean = t.trim();
      const m = clean.match(/^[\w$]+\(([\s\S]*)\);?$/);
      if (m) clean = m[1];
      const json = JSON.parse(clean);
      let rawList = Array.isArray(json) ? json : (json.data || json.customers || json.result || json.values || []);
      if (rawList.length > 0) {
        customersDB = rawList.map(c => {
          if (Array.isArray(c)) return { name: c[0] || '', phone: c[1] || '', address: c[2] || '' };
          return { name: c.name || c.Name || '', phone: c.phone || c.Phone || '', address: c.address || c.Address || '' };
        }).filter(c => c.name && c.name.toLowerCase() !== 'name');
      }
    })
    .catch(() => {
      // ดึงสำรองผ่าน AllOrigins หากติด CORS
      fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(CUSTOMER_SCRIPT_URL)}`)
        .then(r => r.json())
        .then(json => {
          let rawList = Array.isArray(json) ? json : (json.data || json.customers || json.result || json.values || []);
          if (rawList.length > 0) {
            customersDB = rawList.map(c => {
              if (Array.isArray(c)) return { name: c[0] || '', phone: c[1] || '', address: c[2] || '' };
              return { name: c.name || c.Name || '', phone: c.phone || c.Phone || '', address: c.address || c.Address || '' };
            }).filter(c => c.name && c.name.toLowerCase() !== 'name');
          }
        })
        .catch(() => {});
    });
}

function showCustomerDropdown(field) {
  const nameBox = document.getElementById('nameSuggestions');
  const phoneBox = document.getElementById('phoneSuggestions');
  if (field === 'name' && phoneBox) phoneBox.style.display = 'none';
  if (field === 'phone' && nameBox) nameBox.style.display = 'none';

  const inputEl = document.getElementById(field);
  const suggestionsBox = document.getElementById(field + 'Suggestions');
  if (!inputEl || !suggestionsBox) return;

  const keyword = inputEl.value.trim().toLowerCase();
  let matched = [];

  if (!keyword) {
    matched = customersDB.map((c, idx) => ({ c, idx }));
  } else {
    customersDB.forEach((c, idx) => {
      if (String(c.name).toLowerCase().includes(keyword) || String(c.phone).includes(keyword) || String(c.address).toLowerCase().includes(keyword)) {
        matched.push({ c, idx });
      }
    });
  }

  let html = '';
  matched.forEach(item => {
    const c = item.c;
    html += `
      <div class="suggestion-item" onclick="fillCustomer(${item.idx})">
        <b>${c.name}</b> <span style="color:#64748b; font-size:12px;">(${c.phone || '-'})</span>
        <div style="font-size:11.5px; color:#94a3b8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">📍 ${c.address || 'ไม่มีที่อยู่'}</div>
      </div>`;
  });

  if (html === '') {
    html = `<div style="padding:10px; text-align:center; color:#888; font-size:13px;">ไม่พบรายชื่อในระบบ</div>`;
  }

  suggestionsBox.innerHTML = html;
  suggestionsBox.style.display = 'block';
}

function fillCustomer(index) {
  const customer = customersDB[index];
  if (!customer) return;
  document.getElementById('name').value = customer.name || '';
  document.getElementById('phone').value = (customer.phone && customer.phone !== 'N/A') ? customer.phone : '';
  document.getElementById('address').value = customer.address || '';
  document.getElementById('nameSuggestions').style.display = 'none';
  document.getElementById('phoneSuggestions').style.display = 'none';
}

function loadMenuFromDB() {
  loadCustomersFromSheet();
  const scriptMenu = document.createElement('script');
  scriptMenu.src = `${MENU_SCRIPT_URL}?callback=onPOSMenuLoaded&t=${Date.now()}`;
  document.body.appendChild(scriptMenu);
}

window.onPOSMenuLoaded = function(json) {
  if (json && Array.isArray(json.data) && json.data.length > 0) {
    menu = json.data.map(item => ({
      ...item,
      price: Number(item.price) || 0,
      normalizedCategory: normalizeCategory(item.category)
    }));
    renderCategory();
    renderMenu();
  }
};

function parseCustomerOrder(rawText) {
  if (!rawText || !rawText.trim()) return;
  const lines = rawText.split('\n');
  let parsedAny = false;
  let lastAddedItem = null;

  lines.forEach(line => {
    const trimmed = line.trim();
    if (!trimmed || trimmed.includes('____') || trimmed.includes('-----') || trimmed.includes('รายการคำสั่งซื้อ') || trimmed.includes('ยอดรวมสินค้า')) return;

    if (trimmed.startsWith('-') || trimmed.startsWith('•')) {
      const optionText = trimmed.replace(/^[-•]\s*/, '').replace(/^\(|\)$/g, '').trim();
      if (lastAddedItem && optionText) {
        const cleanBase = lastAddedItem.name.replace(/\s*\(.*?\)\s*$/, '').trim();
        lastAddedItem.name = `${cleanBase} (${optionText})`;
      }
      return;
    }

    const itemMatch = trimmed.match(/^\d+\.\s*(.+?)\s+[xX×]\s*(\d+)/);
    if (itemMatch) {
      const fullItemName = itemMatch[1].trim();
      const itemQty = parseInt(itemMatch[2], 10) || 1;
      const baseName = fullItemName.replace(/\s*\(.*?\)\s*/g, '').trim();
      let foundInMenu = menu.find(m => m.name.trim().toLowerCase() === fullItemName.toLowerCase()) ||
                        menu.find(m => m.name.trim().toLowerCase() === baseName.toLowerCase() || m.name.includes(baseName));
      let finalPrice = foundInMenu ? Number(foundInMenu.price) : 0;

      if (finalPrice === 0) {
        const priceMatch = trimmed.match(/\((\d+[\d,]*)\s*฿\)/) || trimmed.match(/=\s*(\d+[\d,]*)\s*฿/);
        if (priceMatch) finalPrice = Math.round(parseFloat(priceMatch[1].replace(/,/g, '')) / itemQty);
      }

      const existingCart = cart.find(c => c.name.toLowerCase() === fullItemName.toLowerCase());
      if (existingCart) {
        existingCart.qty = itemQty;
        lastAddedItem = existingCart;
      } else {
        const newItem = { name: fullItemName, price: finalPrice, qty: itemQty };
        cart.push(newItem);
        lastAddedItem = newItem;
      }
      parsedAny = true;
    }
  });
  if (parsedAny) renderCart();
}

function clearPasteBox() { document.getElementById('pasteOrderInput').value = ''; }

function normalizeCategory(raw) {
  const text = String(raw || '').trim();
  if (text.includes('ผลไม้พร้อมส่งวันนี้')) return 'ผลไม้พร้อมส่งวันนี้';
  if (text.includes('ใกล้หมดฤดูกาล')) return 'ใกล้หมดฤดูกาล';
  if (text.includes('หมดชั่วคราว')) return 'หมดชั่วคราว';
  if (text.includes('หมดฤดูกาลแล้ว')) return 'หมดฤดูกาลแล้ว';
  if (text.includes('บริการการ์ด') || text.includes('ปิ่นโต') || text.includes('ริบบิ้น')) return 'บริการการ์ด ริบบิ้น และปิ่นโตผลไม้';
  return text;
}

function renderCategory() {
  const bar = document.getElementById('categoryBar');
  bar.innerHTML = APP_CATEGORIES.map(c => `
    <div class="category-btn ${c === active ? 'active' : ''}" onclick="selectCat('${c}')">
      ${c === 'บริการการ์ด ริบบิ้น และปิ่นโตผลไม้' ? 'บริการ/ปิ่นโต' : c}
    </div>`).join('');
}

function selectCat(c) { active = c; renderCategory(); renderMenu(); }

function renderMenu() {
  const menuList = document.getElementById('menuList');
  const filtered = menu.filter(i => active === "ทั้งหมด" || i.normalizedCategory === active);
  if (filtered.length === 0) {
    menuList.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color:#94a3b8;">ไม่มีรายการในหมวดนี้</div>`;
    return;
  }
  menuList.innerHTML = filtered.map(i => {
    const isOut = (i.normalizedCategory === 'หมดชั่วคราว' || i.normalizedCategory === 'หมดฤดูกาลแล้ว');
    let badge = '';
    if (i.normalizedCategory === 'ใกล้หมดฤดูกาล') badge = `<span class="item-badge badge-warning">ใกล้หมด</span>`;
    if (i.normalizedCategory === 'หมดชั่วคราว') badge = `<span class="item-badge badge-danger">หมดชั่วคราว</span>`;
    if (i.normalizedCategory === 'หมดฤดูกาลแล้ว') badge = `<span class="item-badge badge-danger">หมดฤดูกาล</span>`;
    const safeName = i.name.replace(/'/g, "\\'");
    const safeCat = (i.category || '').replace(/'/g, "\\'");
    return `
      <div class="menu-item ${isOut ? 'unavailable' : ''}" onclick="${isOut ? '' : `handlePOSItemClick('${safeName}', ${i.price})`}">
        <button class="btn-edit-item" onclick="openEditItem(event, ${i.rowIndex}, '${safeName}', ${i.price}, '${safeCat}')">⚙️</button>
        <div>${badge}<div class="menu-title">${i.name}</div></div>
        <div class="menu-price">${i.price > 0 ? `฿${i.price}` : 'ฟรี/พิเศษ'}</div>
      </div>`;
  }).join('');
}

function handlePOSItemClick(name, price) {
  if (name.includes('น้ำปลาหวาน')) {
    pendingPOSItem = { name, price };
    document.getElementById('posSauceTitle').innerText = name;
    openModal('posSauceModal');
  } else {
    addItem(name, price);
  }
}

function confirmSauceSelection(sauceName) {
  if (pendingPOSItem) addItem(`${pendingPOSItem.name} (${sauceName})`, pendingPOSItem.price);
  closeModal('posSauceModal');
  pendingPOSItem = null;
}

function openEditItem(event, rowIndex, name, price, category) {
  event.stopPropagation();
  document.getElementById('editItemTitle').innerText = `แก้ไข: ${name}`;
  document.getElementById('editRowIndex').value = rowIndex;
  document.getElementById('editItemPrice').value = price;
  const catSelect = document.getElementById('editItemCategory');
  for (let opt of catSelect.options) {
    if (category.includes(opt.text)) { catSelect.value = opt.value; break; }
  }
  openModal('editItemModal');
}

async function saveItemUpdate() {
  const rowIndex = Number(document.getElementById('editRowIndex').value);
  const price = Number(document.getElementById('editItemPrice').value);
  const category = document.getElementById('editItemCategory').value;
  closeModal('editItemModal');
  customAlert("กำลังบันทึกการแก้ไขลงชีท...");
  try {
    await fetch(MENU_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'updateItem', rowIndex, price, category })
    });
    setTimeout(() => { closeModal('alertModal'); loadMenuFromDB(); }, 1400);
  } catch (e) { customAlert("เกิดข้อผิดพลาดในการบันทึก"); }
}

function addItem(name, price) {
  let f = cart.find(i => i.name === name);
  if (f) f.qty++;
  else cart.push({ name, price: Number(price) || 0, qty: 1 });
  renderCart();
}

function renderCart() {
  let total = 0;
  const cartList = document.getElementById('cartList');
  cartList.innerHTML = cart.map((i, idx) => {
    let p = Number(i.price) || 0;
    let sum = p * i.qty;
    total += sum;
    return `
      <div class="cart-item">
        <div style="margin-bottom: 6px; font-weight: 500;">${i.name}</div>
        <div class="cart-row">
          <span style="color:#64748b; font-weight: 400;">${p} x ${i.qty}</span>
          <span style="color:#0f172a;">฿${sum}</span>
        </div>
        <div class="qty-controls">
          <button onclick="change(${idx},-1)">-1</button>
          <button onclick="change(${idx},1)">+1</button>
          <button onclick="change(${idx},10)">+10</button>
          <button onclick="setQty(${idx},10)">=10</button>
          <button onclick="setQty(${idx},20)">=20</button>
          <button onclick="setQty(${idx},30)">=30</button>
          <button onclick="setQty(${idx},0)" class="btn-remove" style="margin-left:auto;">ลบ</button>
        </div>
      </div>`;
  }).join('');
  total += Number(document.getElementById('shipping').value || 0);
  document.getElementById('totalEl').innerText = total.toLocaleString();
}

function change(i, d) { cart[i].qty += d; if (cart[i].qty <= 0) cart.splice(i, 1); renderCart(); }
function setQty(i, q) { if (q <= 0) cart.splice(i, 1); else cart[i].qty = q; renderCart(); }

function addCustom() {
  const name = document.getElementById('customName').value.trim();
  const price = parseFloat(document.getElementById('customPrice').value);
  if (!name || isNaN(price)) return customAlert('กรุณากรอกชื่อและราคาสินค้าให้ครบถ้วน');
  let f = cart.find(i => i.name === name && i.price === price);
  if (f) f.qty++; else cart.push({ name, price, qty: 1 });
  renderCart();
  document.getElementById('customName').value = "";
  document.getElementById('customPrice').value = "";
}

function checkout() {
  if (cart.length === 0) return customAlert('ตะกร้าสินค้าว่างเปล่า กรุณาเลือกสินค้าก่อนสรุปบิล');
  const nameVal = document.getElementById('name').value.trim() || 'ไม่ระบุ';
  const cleanName = nameVal.startsWith('คุณ') ? nameVal.replace(/^คุณ\s*/, '') : nameVal;
  const phone = document.getElementById('phone').value.trim() || 'ไม่ระบุ';
  const address = document.getElementById('address').value.trim() || 'ไม่ระบุ';
  const shipping = Number(document.getElementById('shipping').value) || 0;
  const remark = document.getElementById('remark').value.trim();
  
  let dateStr = "";
  const dateInput = document.getElementById('orderDate').value;
  if (dateInput) {
    const [y, m, d] = dateInput.split('-');
    dateStr = `${d}/${m}/${y}`;
  } else {
    const d = new Date();
    dateStr = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
  }
  
  let billText = `${dateStr}\nออเดอร์คุณ ${cleanName}\n(${phone})\n\nรายการคำสั่งซื้อ\n---------------------\n`;
  
  cart.forEach((item, idx) => {
    const cleanItemName = item.name.replace(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}]/gu, '').trim();
    const itemTotal = (item.price * item.qty).toLocaleString();
    const optionMatch = cleanItemName.match(/^(.*?)\s*\((.*?)\)$/);

    if (optionMatch) {
      const baseName = optionMatch[1].trim();
      let optionText = optionMatch[2].trim();
      if (!optionText.startsWith('สูตร')) {
        optionText = optionText.replace(/^น้ำปลาหวาน\s*/, '');
        if (!optionText.startsWith('สูตร')) optionText = 'สูตร' + optionText;
      }
      billText += `${idx + 1}. ${baseName}\n  - (${optionText}) ×${item.qty} (${itemTotal}฿)\n`;
    } else {
      billText += `${idx + 1}. ${cleanItemName} ×${item.qty} (${itemTotal}฿)\n`;
    }
  });
  
  billText += `---------------------\n\nค่าส่ง ${shipping.toLocaleString()}฿\nรวมทั้งหมด ${document.getElementById('totalEl').innerText}฿\n\n📍 ${address}`;
  if (remark) billText += `\nหมายเหตุ: ${remark}`;

  document.getElementById('billTextarea').value = billText.trim();
  openModal('billModal');
}

function newOrder() { if (cart.length > 0) openModal('confirmModal'); else executeNewOrder(); }

function executeNewOrder() {
  closeModal('confirmModal');
  cart = [];
  ['pasteOrderInput', 'name', 'phone', 'address', 'shipping', 'remark', 'customName', 'customPrice'].forEach(id => {
    document.getElementById(id).value = "";
  });
  setDefaultDate();
  renderCart();
}

function setDefaultDate() {
  const d = new Date();
  document.getElementById('orderDate').value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function customAlert(msg) { document.getElementById('alertMessage').innerText = msg; openModal('alertModal'); }

function copyBillText() {
  const copyText = document.getElementById("billTextarea");
  copyText.select();
  copyText.setSelectionRange(0, 99999);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(copyText.value);
  } else {
    document.execCommand("copy");
  }
  const btn = document.getElementById('copyBtn');
  btn.innerText = 'คัดลอกสำเร็จ!';
  btn.style.background = '#0ea5e9';
  setTimeout(() => { btn.innerText = 'คัดลอกข้อความ'; btn.style.background = '#EC5228'; }, 2000);
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.autocomplete-wrapper')) {
    document.getElementById('nameSuggestions').style.display = 'none';
    document.getElementById('phoneSuggestions').style.display = 'none';
  }
});

setDefaultDate();
loadMenuFromDB();
</script>
