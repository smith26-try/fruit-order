<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแปลงออเดอร์เป็นใบเสร็จ 56mm</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; text-align: center; }
        .box { background: white; max-width: 500px; margin: auto; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input, button { margin: 10px 0; width: 100%; padding: 10px; box-sizing: border-box; }
        button { background: #ff5722; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button:disabled { background: #ccc; }
        
        /* ใบเสร็จขนาด 56mm (ประมาณ 230px) */
        #receipt {
            width: 220px;
            background: #fff;
            color: #000;
            padding: 10px 8px;
            margin: 20px auto;
            text-align: left;
            font-size: 11px;
            line-height: 1.3;
            box-sizing: border-box;
            border: 1px solid #ddd;
            display: none;
        }
        .center { text-align: center; }
        .bold { font-weight: bold; }
        .large { font-size: 26px; margin-bottom: 4px; }
        .divider { border-bottom: 1px dashed #000; margin: 6px 0; }
        .info { font-size: 9px; margin-bottom: 2px; }
        .row { display: flex; justify-content: space-between; }
        .col-qty { width: 15%; font-weight: bold; }
        .col-name { width: 55%; font-weight: bold; word-break: break-word; }
        .col-price { width: 30%; text-align: right; }
        .sub-item { font-size: 9px; color: #444; padding-left: 15%; }
        .total-row { font-size: 14px; font-weight: bold; }
        .footer-1 { font-size: 12px; font-weight: bold; margin-top: 8px; }
        .footer-2 { font-size: 10px; margin-top: 2px; }
    </style>
</head>
<body>

<div class="box">
    <h2>แปลงรูปออเดอร์เป็นใบเสร็จ PNG</h2>
    <input type="password" id="apiKey" placeholder="ใส่ Gemini API Key ของคุณ">
    <input type="file" id="imageInput" accept="image/*">
    <button id="processBtn" onclick="processImage()">แปลงเป็นใบเสร็จ</button>
    <div id="status"></div>
    <button id="downloadBtn" style="display:none; background:#4caf50;" onclick="downloadPNG()">ดาวน์โหลดไฟล์ PNG</button>

    <div id="receipt">
        <div class="center bold large" id="r-order">#0000</div>
        <div class="divider"></div>
        <div class="info" id="r-code">รหัสใบสั่งซื้อ: -</div>
        <div class="info" id="r-time">เวลา: -</div>
        <div class="info" id="r-customer">ลูกค้า: -</div>
        <div class="info" id="r-driver">คนขับ: -</div>
        <div class="divider"></div>

        <div id="r-items"></div>

        <div class="divider"></div>
        <div class="bold" style="font-size: 10px;" id="r-utensils">[ รับช้อนส้อมพลาสติก ]</div>
        <div class="divider"></div>

        <div class="row">
            <span>รวมเป็นเงิน</span>
            <span id="r-subtotal">0.00</span>
        </div>
        <div class="row info" id="r-discount-row" style="display:none;">
            <span>ส่วนลดร้านค้า</span>
            <span id="r-discount">0.00</span>
        </div>
        <div class="divider"></div>
        <div class="row total-row">
            <span>ยอดรวมสุทธิ</span>
            <span id="r-total">0.00</span>
        </div>
        <div class="row info" style="margin-top:4px;">
            <span>วิธีชำระเงิน</span>
            <span id="r-payment">E-Payment</span>
        </div>

        <div class="divider"></div>
        <div class="center footer-1">ปอกใส่ปากผลไม้พร้อมทาน</div>
        <div class="center footer-2">ขอบคุณลูกค้าที่ใช้บริการค่ะ</div>
    </div>
</div>

<script>
async function processImage() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const fileInput = document.getElementById('imageInput');
    const status = document.getElementById('status');
    const btn = document.getElementById('processBtn');

    if (!apiKey) { alert('กรุณากรอก Gemini API Key'); return; }
    if (!fileInput.files[0]) { alert('กรุณาเลือกรูปภาพออเดอร์'); return; }

    btn.disabled = true;
    status.innerText = 'กำลังอ่านข้อมูลจากภาพ...';

    const file = fileInput.files[0];
    const base64Image = await toBase64(file);

    const prompt = `ดึงข้อมูลจากภาพออเดอร์นี้และส่งกลับเป็น JSON ภาษาไทยที่มีโครงสร้างดังนี้เท่านั้น (ไม่มีข้อความอื่นเพิ่มเติม):
{
  "order_number": "หมายเลขออเดอร์ เช่น 3141",
  "order_code": "รหัสใบสั่งซื้อ เช่น LMF-260526-524203141",
  "datetime": "วันที่และเวลา เช่น 26 พ.ค. 69, 21:14",
  "customer": "ชื่อลูกค้าพร้อมวงเล็บถ้ามี หรือตัดออกถ้าไม่มี",
  "driver": "ชื่อคนขับ หรือ - ถ้าไม่มี",
  "items": [
    {
      "qty": "จำนวน เช่น 1x",
      "name": "ชื่อสินค้า",
      "price": "ราคา เช่น 75.00",
      "sub_items": ["ตัวเลือกย่อย 1", "ตัวเลือกย่อย 2"]
    }
  ],
  "utensils": true หรือ false (รับช้อนส้อมหรือไม่),
  "subtotal": "ราคารวม เช่น 144.00",
  "discount": "ส่วนลด เช่น -40.00 หรือ null ถ้าไม่มี",
  "total": "ยอดรวมสุทธิ เช่น 104.00",
  "payment_method": "วิธีชำระเงิน เช่น E-Payment"
}`;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{
                    parts: [
                        { text: prompt },
                        { inline_data: { mime_type: file.type, data: base64Image.split(',')[1] } }
                    ]
                }],
                generationConfig: { response_mime_type: "application/json" }
            })
        });

        const data = await response.json();
        const resultText = data.candidates[0].content.parts[0].text;
        const orderData = JSON.parse(resultText);

        renderReceipt(orderData);
        status.innerText = 'ประมวลผลสำเร็จ!';
        document.getElementById('downloadBtn').style.display = 'block';
    } catch (err) {
        console.error(err);
        status.innerText = 'เกิดข้อผิดพลาดในการอ่านข้อมูลภาพ';
    } finally {
        btn.disabled = false;
    }
}

function renderReceipt(data) {
    document.getElementById('r-order').innerText = '#' + (data.order_number || '');
    document.getElementById('r-code').innerText = 'รหัสใบสั่งซื้อ: ' + (data.order_code || '-');
    document.getElementById('r-time').innerText = 'เวลา: ' + (data.datetime || '-');
    document.getElementById('r-customer').innerText = 'ลูกค้า: ' + (data.customer || '-');
    document.getElementById('r-driver').innerText = 'คนขับ: ' + (data.driver || '-');
    
    let itemsHtml = '';
    (data.items || []).forEach(item => {
        itemsHtml += `
            <div class="row" style="margin-top:4px;">
                <span class="col-qty">${item.qty}</span>
                <span class="col-name">${item.name}</span>
                <span class="col-price">${item.price}</span>
            </div>
        `;
        (item.sub_items || []).forEach(sub => {
            itemsHtml += `<div class="sub-item">- ${sub}</div>`;
        });
    });
    document.getElementById('r-items').innerHTML = itemsHtml;

    document.getElementById('r-utensils').style.display = data.utensils ? 'block' : 'none';
    document.getElementById('r-subtotal').innerText = data.subtotal || '0.00';
    
    if (data.discount) {
        document.getElementById('r-discount-row').style.display = 'flex';
        document.getElementById('r-discount').innerText = data.discount;
    } else {
        document.getElementById('r-discount-row').style.display = 'none';
    }
    
    document.getElementById('r-total').innerText = data.total || '0.00';
    document.getElementById('r-payment').innerText = data.payment_method || 'E-Payment';

    document.getElementById('receipt').style.display = 'block';
}

function downloadPNG() {
    const receipt = document.getElementById('receipt');
    html2canvas(receipt, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `receipt_${document.getElementById('r-order').innerText.replace('#','')}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}

function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}
</script>

</body>
</html>
